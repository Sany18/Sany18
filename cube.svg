<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 350" width="100%" height="100%">
  <foreignObject width="100%" height="100%">
    <div xmlns="http://www.w3.org/1999/xhtml">
      <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }

        body {
          display: flex;
          justify-content: center;
          align-items: center;
          min-height: 350px;
          overflow: hidden;
          background: #0a0a0a;
        }

        .scene {
          width: 100%;
          height: 350px;
          perspective: 900px;
          display: flex;
          justify-content: center;
          align-items: center;
        }

        .cube {
          width: 320px;
          height: 320px;
          position: relative;
          transform-style: preserve-3d;
          animation: rotate 8s linear infinite;
        }

        .face {
          position: absolute;
          width: 320px;
          height: 320px;
          border: 2px solid;
          display: flex;
          align-items: center;
          justify-content: center;
          font-family: "Courier New", monospace;
          backface-visibility: visible;
        }

        .f-front  {
          border-color: #00ffff;
          background: rgba(0, 255, 255, 0.08);
          box-shadow: inset 0 0 40px rgba(0, 255, 255, 0.1), 0 0 20px rgba(0, 255, 255, 0.3);
          transform: translateZ(160px);
        }
        .f-back {
          border-color: #ff00ff;
          background: rgba(255, 0, 255, 0.08);
          box-shadow: inset 0 0 40px rgba(255, 0, 255, 0.1), 0 0 20px rgba(255, 0, 255, 0.3);
          transform: rotateY(180deg) translateZ(160px);
        }
        .f-right {
          border-color: #ffff00;
          background: rgba(255, 255, 0, 0.08);
          box-shadow: inset 0 0 40px rgba(255, 255, 0, 0.1), 0 0 20px rgba(255, 255, 0, 0.3);
          transform: rotateY(90deg) translateZ(160px);
        }
        .f-left {
          border-color: #00ff00;
          background: rgba(0, 255, 0, 0.08);
          box-shadow: inset 0 0 40px rgba(0, 255, 0, 0.1), 0 0 20px rgba(0, 255, 0, 0.3);
          transform: rotateY(-90deg) translateZ(160px);
        }
        .f-top {
          border-color: #ff6600;
          background: rgba(255, 102, 0, 0.08);
          box-shadow: inset 0 0 40px rgba(255, 102, 0, 0.1), 0 0 20px rgba(255, 102, 0, 0.3);
          transform: rotateX(90deg) translateZ(160px);
        }
        .f-bottom {
          border-color: #ff0066;
          background: rgba(255, 0, 102, 0.08);
          box-shadow: inset 0 0 40px rgba(255, 0, 102, 0.1), 0 0 20px rgba(255, 0, 102, 0.3);
          transform: rotateX(-90deg) translateZ(160px);
        }

        .hoxz {
          font-size: 52px;
          font-weight: 900;
          letter-spacing: 6px;
          color: #00ffff;
          text-shadow: 0 0 10px #00ffff, 0 0 30px #00ffff, 0 0 60px rgba(0, 255, 255, 0.4);
        }

        @keyframes rotate {
          0%   { transform: rotateX(0deg)    rotateY(0deg)    rotateZ(0deg); }
          100% { transform: rotateX(360deg)  rotateY(360deg)  rotateZ(360deg); }
        }

        @media (prefers-color-scheme: light) {
          body { background: #f0f0f0; }
        }
      </style>

      <body>
        <div class="scene">
          <div class="cube">
            <div class="face f-front"><span class="hoxz">HOXZ</span></div>
            <div class="face f-back"></div>
            <div class="face f-right"></div>
            <div class="face f-left"></div>
            <div class="face f-top"></div>
            <div class="face f-bottom"></div>
          </div>
        </div>
      </body>
    </div>
  </foreignObject>
</svg>
