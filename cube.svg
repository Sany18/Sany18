<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 400" width="400" height="400">
  <foreignObject width="100%" height="100%">
    <div xmlns="http://www.w3.org/1999/xhtml">
      <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }

        body {
          display: flex;
          justify-content: center;
          align-items: center;
          min-height: 100vh;
          background: #0d1117;
          overflow: hidden;
        }

        .scene {
          width: 200px;
          height: 200px;
          perspective: 800px;
        }

        .cube {
          width: 100%;
          height: 100%;
          position: relative;
          transform-style: preserve-3d;
          animation: rotate 12s linear infinite;
        }

        .face {
          position: absolute;
          width: 200px;
          height: 200px;
          border: 2px solid rgba(88, 166, 255, 0.4);
          border-radius: 10px;
          display: flex;
          flex-direction: column;
          align-items: center;
          justify-content: center;
          gap: 6px;
          font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
          backface-visibility: visible;
          text-decoration: none;
        }

        .face .num {
          font-size: 14px;
          color: rgba(88, 166, 255, 0.6);
          font-weight: 600;
          letter-spacing: 1px;
        }

        .face .name {
          font-size: 15px;
          font-weight: 700;
          color: #e6edf3;
          letter-spacing: 0.5px;
        }

        .face .desc {
          font-size: 9px;
          color: #8b949e;
          text-align: center;
          max-width: 140px;
          line-height: 1.3;
        }

        .face-front  {
          background: rgba(31, 111, 235, 0.2);
          transform: translateZ(100px);
        }
        .face-back {
          background: rgba(137, 87, 229, 0.2);
          transform: rotateY(180deg) translateZ(100px);
        }
        .face-right {
          background: rgba(35, 134, 54, 0.2);
          transform: rotateY(90deg) translateZ(100px);
        }
        .face-left {
          background: rgba(218, 75, 75, 0.2);
          transform: rotateY(-90deg) translateZ(100px);
        }
        .face-top {
          background: rgba(219, 171, 9, 0.2);
          transform: rotateX(90deg) translateZ(100px);
        }
        .face-bottom {
          background: rgba(56, 139, 253, 0.2);
          transform: rotateX(-90deg) translateZ(100px);
        }

        @keyframes rotate {
          0%   { transform: rotateX(-15deg) rotateY(0deg); }
          100% { transform: rotateX(-15deg) rotateY(360deg); }
        }

        @keyframes glow {
          0%, 100% { box-shadow: 0 0 15px rgba(88, 166, 255, 0.2); }
          50%      { box-shadow: 0 0 30px rgba(88, 166, 255, 0.5); }
        }

        .face { animation: glow 4s ease-in-out infinite; }

        .label {
          position: absolute;
          bottom: -36px;
          width: 100%;
          text-align: center;
          color: #8b949e;
          font-size: 11px;
          font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
          letter-spacing: 2px;
        }

        @media (prefers-color-scheme: light) {
          body { background: #ffffff; }
          .face { border-color: rgba(9, 105, 218, 0.3); }
          .face-front  { background: rgba(9, 105, 218, 0.15); }
          .face-back   { background: rgba(137, 87, 229, 0.15); }
          .face-right  { background: rgba(35, 134, 54, 0.15); }
          .face-left   { background: rgba(207, 34, 46, 0.15); }
          .face-top    { background: rgba(191, 135, 0, 0.15); }
          .face-bottom { background: rgba(9, 105, 218, 0.15); }
          .face .name  { color: #1f2328; }
          .face .desc  { color: #57606a; }
          .label       { color: #57606a; }
        }
      </style>

      <body>
        <div style="position: relative;">
          <div class="scene">
            <div class="cube">
              <a class="face face-front" href="https://sany18.github.io/note-keeper/">
                <span class="num">[1]</span>
                <span class="name">note keeper</span>
                <span class="desc">secure notes, powered by google drive</span>
              </a>
              <a class="face face-back" href="https://sany18.github.io/cv/">
                <span class="num">[2]</span>
                <span class="name">my cv</span>
                <span class="desc">professional journey &amp; skills</span>
              </a>
              <a class="face face-right" href="https://alter-space.biz.ua/gta-vc/">
                <span class="num">[3]</span>
                <span class="name">GTA VC</span>
                <span class="desc">old good GTA Vice City web port</span>
              </a>
              <a class="face face-left" href="https://alter-space.biz.ua/">
                <span class="num">[4]</span>
                <span class="name">alter space</span>
                <span class="desc">web sketches, early creative work</span>
              </a>
              <a class="face face-top" href="https://hoxzy.blogspot.com/">
                <span class="num">[5]</span>
                <span class="name">hoxzy blog</span>
                <span class="desc">tech thoughts, free form</span>
              </a>
              <a class="face face-bottom" href="https://donatello.to/hoxz">
                <span class="num">[6]</span>
                <span class="name">support</span>
                <span class="desc">buy me a coffee</span>
              </a>
            </div>
          </div>
          <div class="label">SANY18</div>
        </div>
      </body>
    </div>
  </foreignObject>
</svg>
