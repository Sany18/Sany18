<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 400" width="400" height="400">
  <foreignObject width="100%" height="100%">
    <div xmlns="http://www.w3.org/1999/xhtml">
      <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }

        body {
          display: flex;
          justify-content: center;
          align-items: center;
          min-height: 100vh;
          background: #0d1117;
          perspective: 800px;
          overflow: hidden;
        }

        .scene {
          width: 180px;
          height: 180px;
          perspective: 800px;
        }

        .cube {
          width: 100%;
          height: 100%;
          position: relative;
          transform-style: preserve-3d;
          animation: rotate 8s linear infinite;
        }

        .face {
          position: absolute;
          width: 180px;
          height: 180px;
          border: 2px solid rgba(88, 166, 255, 0.5);
          border-radius: 8px;
          display: flex;
          align-items: center;
          justify-content: center;
          font-size: 48px;
          font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
          backface-visibility: visible;
        }

        /* front  */
        .front  {
          background: rgba(31, 111, 235, 0.25);
          transform: translateZ(90px);
        }
        /* back */
        .back {
          background: rgba(137, 87, 229, 0.25);
          transform: rotateY(180deg) translateZ(90px);
        }
        /* right */
        .right {
          background: rgba(35, 134, 54, 0.25);
          transform: rotateY(90deg) translateZ(90px);
        }
        /* left */
        .left {
          background: rgba(218, 75, 75, 0.25);
          transform: rotateY(-90deg) translateZ(90px);
        }
        /* top */
        .top {
          background: rgba(219, 171, 9, 0.25);
          transform: rotateX(90deg) translateZ(90px);
        }
        /* bottom */
        .bottom {
          background: rgba(56, 139, 253, 0.25);
          transform: rotateX(-90deg) translateZ(90px);
        }

        /* spin on X + Y */
        @keyframes rotate {
          0%   { transform: rotateX(0deg)   rotateY(0deg); }
          100% { transform: rotateX(360deg) rotateY(360deg); }
        }

        /* subtle glow pulse */
        @keyframes glow {
          0%, 100% { box-shadow: 0 0 20px rgba(88, 166, 255, 0.3); }
          50%      { box-shadow: 0 0 40px rgba(88, 166, 255, 0.6); }
        }

        .face {
          animation: glow 3s ease-in-out infinite;
        }

        .label {
          position: absolute;
          bottom: -40px;
          width: 100%;
          text-align: center;
          color: #8b949e;
          font-size: 12px;
          font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
          letter-spacing: 1px;
        }

        @media (prefers-color-scheme: light) {
          body { background: #ffffff; }
          .face { border-color: rgba(9, 105, 218, 0.5); }
          .front  { background: rgba(9, 105, 218, 0.2); }
          .back   { background: rgba(137, 87, 229, 0.2); }
          .right  { background: rgba(35, 134, 54, 0.2); }
          .left   { background: rgba(207, 34, 46, 0.2); }
          .top    { background: rgba(191, 135, 0, 0.2); }
          .bottom { background: rgba(9, 105, 218, 0.2); }
          .label  { color: #57606a; }
        }
      </style>

      <body>
        <div style="position: relative;">
          <div class="scene">
            <div class="cube">
              <div class="face front">H</div>
              <div class="face back">X</div>
              <div class="face right">Z</div>
              <div class="face left">Y</div>
              <div class="face top">2</div>
              <div class="face bottom">1</div>
            </div>
          </div>
          <div class="label">SANY18</div>
        </div>
      </body>
    </div>
  </foreignObject>
</svg>
