          <div class="trunk" style="left:49.94px; top:62px; width:2px; height:6px;"></div>
          <div class="trunk" style="left:53px; top:57px; width:2px; height:6px;"></div>

          <div class="frond-wrap fw1">
            <div class="tri" style="clip-path:polygon(53.5px 59.2px, 52.5px 54.8px, 60.5px 55.4px);"></div>
            <div class="tri" style="clip-path:polygon(60.8px 56.5px, 60.3px 54.3px, 66.7px 59.6px);"></div>
          </div>
          <div class="frond-wrap fw2">
            <div class="tri" style="clip-path:polygon(54.7px 58.4px, 51.3px 55.6px, 57.9px 51.1px);"></div>
            <div class="tri" style="clip-path:polygon(58.8px 51.8px, 57.1px 50.4px, 62.0px 47.9px);"></div>
