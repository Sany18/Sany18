          <div class="sky"></div>
          <div class="sun"></div>

          <div class="mtn-shape" style="background:var(--mtn-shadow); clip-path:polygon(-10px 78px, 15px 66px, 40px 78px);"></div>
          <div class="mtn-shape" style="background:var(--mtn); clip-path:polygon(15px 78px, 30px 60px, 45px 78px);"></div>
          <div class="mtn-shape" style="background:var(--mtn-dark); clip-path:polygon(35px 78px, 45px 68px, 55px 78px);"></div>
          <div class="mtn-shape" style="background:var(--mtn-shadow); clip-path:polygon(122px 78px, 132px 68px, 142px 78px);"></div>
          <div class="mtn-shape" style="background:var(--mtn-shadow); clip-path:polygon(145px 78px, 165px 73px, 185px 78px);"></div>
          <div class="mtn-shape" style="background:var(--mtn-dark); clip-path:polygon(130px 78px, 145px 58px, 160px 78px);"></div>
          <div class="mtn-shape" style="background:var(--mtn); clip-path:polygon(100px 78px, 109px 73px, 118px 78px);"></div>

          <div class="bldg" style="left:1px; top:54px; width:6px; height:24px;"></div>
          <div class="spire" style="left:4px; top:50px; height:4px;"></div>
          <div class="bldg" style="left:8px; top:61px; width:5px; height:17px;"></div>
          <div class="bldg" style="left:151px; top:49px; width:7px; height:29px;"></div>
          <div class="spire" style="left:154px; top:44px; height:5px;"></div>
          <div class="beacon" style="left:154px; top:44px;"></div>
          <div class="bldg" style="left:143px; top:59px; width:5px; height:19px;"></div>

          <div class="win blink" style="left:3px; top:59px;"></div>
          <div class="win dim blink" style="left:3px; top:65px;"></div>
          <div class="win" style="left:4px; top:70px;"></div>
          <div class="win blink" style="left:10px; top:66px;"></div>
          <div class="win dim blink" style="left:9px; top:72px;"></div>
          <div class="win dim blink" style="left:153px; top:56px;"></div>
          <div class="win blink" style="left:154px; top:63px;"></div>
          <div class="win" style="left:153px; top:69px;"></div>
          <div class="win blink" style="left:145px; top:64px;"></div>
