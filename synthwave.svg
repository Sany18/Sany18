<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 160 128" width="100%" height="100%">
  <foreignObject width="100%" height="100%">
    <div xmlns="http://www.w3.org/1999/xhtml">
      <style>
        :root {
          --sky-top: #340038;
          --sky-bottom: #d16500;
          --sun: #fa9e00;
          --grid: #d90280;
          --grid-glow: #4a0135;
          --mtn-shadow: #5c051b;
          --mtn: #593a55;
          --mtn-dark: #4a083f;
          --building: #220c38;
          --light: #ffb454;
          --light-dim: #a9702f;
          --beacon: #ff2020;
          --ground: rgba(8, 0, 12, 0.6);
        }

        * { margin: 0; padding: 0; box-sizing: border-box; }

        body { overflow: hidden; }

        .scene {
          position: relative;
          width: 100%;
          height: 128px;
          overflow: hidden;
        }

        .sky {
          position: absolute;
          top: 0; left: 0;
          width: 100%; height: 78px;
          background: linear-gradient(to bottom, var(--sky-top) 0%, var(--sky-bottom) 100%);
        }

        .sun {
          position: absolute;
          left: 52px; top: 35px;
          width: 56px; height: 56px;
          border-radius: 50%;
          background: var(--sun);
          --cuts: black 0, black 5px, transparent 5px, transparent 13px,
            black 13px, black 17px, transparent 17px, transparent 22px,
            black 22px, black 27px, transparent 27px, transparent 30px,
            black 30px, black 34px, transparent 34px, transparent 36px,
            black 36px, black 40px, transparent 40px, transparent 41px,
            black 41px, black 45px, transparent 45px, transparent 46px,
            black 46px, black 56px;
          -webkit-mask-image: linear-gradient(to bottom, var(--cuts));
          mask-image: linear-gradient(to bottom, var(--cuts));
        }

        .mtn-shape { position: absolute; inset: 0; }

        .frond-wrap {
          position: absolute;
          inset: 0;
          transform-origin: 53px 57px;
          animation-timing-function: ease-in-out;
          animation-iteration-count: infinite;
        }
        .frond-wrap .tri { position: absolute; inset: 0; background: var(--mtn-shadow); }
        .fw1 { animation-name: sway1; animation-duration: 4.2s; }
        .fw2 { animation-name: sway2; animation-duration: 3.6s; animation-delay: -1s; }
        .fw3 { animation-name: sway3; animation-duration: 5s; animation-delay: -2.4s; }
        .fw4 { animation-name: sway4; animation-duration: 3.8s; animation-delay: -.6s; }
        .fw5 { animation-name: sway5; animation-duration: 4.6s; animation-delay: -3s; }
        @keyframes sway1 { 0%, 100% { transform: rotate(0deg); } 50% { transform: rotate(4deg); } }
        @keyframes sway2 { 0%, 100% { transform: rotate(0deg); } 50% { transform: rotate(-4deg); } }
        @keyframes sway3 { 0%, 100% { transform: rotate(0deg); } 50% { transform: rotate(2deg); } }
        @keyframes sway4 { 0%, 100% { transform: rotate(0deg); } 50% { transform: rotate(4deg); } }
        @keyframes sway5 { 0%, 100% { transform: rotate(0deg); } 50% { transform: rotate(-3deg); } }
        .trunk { position: absolute; background: var(--mtn-shadow); }
        .hub { position: absolute; border-radius: 50%; background: var(--mtn-shadow); }

        .bldg { position: absolute; background: var(--building); }
        .spire { position: absolute; bottom: 100%; width: 1px; background: var(--building); }
        .win { position: absolute; width: 1px; height: 1px; background: var(--light); }
        .win.dim { background: var(--light-dim); }
        .win.blink { animation: blink 4s ease-in-out infinite; }
        .beacon {
          position: absolute;
          width: 1px; height: 1px;
          background: var(--beacon);
          animation: beacon 1s steps(1) infinite;
        }
        @keyframes blink {
          0%, 38% { opacity: 1; }
          50%, 88% { opacity: .15; }
          100% { opacity: 1; }
        }
        @keyframes beacon {
          0%, 49% { opacity: 1; }
          50%, 100% { opacity: .1; }
        }

        .ground {
          position: absolute;
          left: 0; top: 78px;
          width: 100%; height: 50px;
          background: var(--ground);
        }
        .grid-lines {
          position: absolute;
          inset: 0;
          overflow: hidden;
        }
        .dline, .hline {
          position: absolute;
          height: 1px;
          background: var(--grid);
          transform-origin: 0 50%;
        }
        .dline.glow, .hline.glow {
          height: 1px;
          background: var(--grid-glow);
        }
        .hline { left: 0; width: 160px; }
        .hwrap {
          position: absolute;
          left: 0; width: 160px; height: 3px;
          animation-duration: .5s;
          animation-timing-function: linear;
          animation-iteration-count: infinite;
        }
        .hwrap .hline.glow { height: 3px; top: 0; }

        @keyframes hscroll0 { from { transform: translateY(0); } to { transform: translateY(1px); } }
        @keyframes hscroll1 { from { transform: translateY(0); } to { transform: translateY(3px); } }
        @keyframes hscroll2 { from { transform: translateY(0); } to { transform: translateY(5px); } }
        @keyframes hscroll3 { from { transform: translateY(0); } to { transform: translateY(7px); } }
        @keyframes hscroll4 { from { transform: translateY(0); } to { transform: translateY(9px); } }
        @keyframes hscroll5 { from { transform: translateY(0); } to { transform: translateY(11px); } }
        @keyframes hscroll6 { from { transform: translateY(0); } to { transform: translateY(13px); } }
        @keyframes hscroll7 { from { transform: translateY(0); } to { transform: translateY(15px); } }
      </style>

      <body>
