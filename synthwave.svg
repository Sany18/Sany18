          <div class="grid-lines">
            <div class="dline glow" style="left:-160px; top:125.5px; width:167.04px; transform:rotate(-16.70deg);"></div>
            <div class="dline" style="left:-160px; top:126.5px; width:167.04px; transform:rotate(-16.70deg);"></div>
            <div class="dline glow" style="left:-130px; top:125.5px; width:148.00px; transform:rotate(-18.92deg);"></div>
            <div class="dline" style="left:-130px; top:126.5px; width:148.00px; transform:rotate(-18.92deg);"></div>
            <div class="dline glow" style="left:-100px; top:125.5px; width:129.24px; transform:rotate(-21.80deg);"></div>
