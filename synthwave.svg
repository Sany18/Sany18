<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 350" width="100%" height="100%">
  <foreignObject width="100%" height="100%">
    <div xmlns="http://www.w3.org/1999/xhtml">
      <style>
        :root {
          --horizon: 205px;

          --sky-top:  #340038;
          --sky-mid:  #7a1550;
          --sky-bottom: #d16500;

          --sun: #fa9e00;
          --sun-core: #ffe08a;

          --grid: #d90280;
          --grid-glow: #4a0135;
          --grid-haze: #9c0166;

          --mtn-shadow: #5c051b;
          --mtn: #593a55;
          --mtn-dark: #4a083f;

          --building: #220c38;
          --light: #ffb454;
          --light-dim: #a9702f;
          --beacon: #ff2020;

          --ground: #0a0010;
        }

        * { margin: 0; padding: 0; box-sizing: border-box; }

        body {
          display: flex;
          justify-content: center;
          align-items: center;
          min-height: 350px;
          overflow: hidden;
          background: var(--ground);
          font-family: "Courier New", monospace;
        }

        .scene {
          position: relative;
          width: 100%;
          height: 350px;
          overflow: hidden;
        }

        /* ---------- sky ---------- */
        .sky {
          position: absolute;
          top: 0; left: 0;
          width: 100%;
          height: var(--horizon);
          background: linear-gradient(to bottom, var(--sky-top) 0%, var(--sky-mid) 62%, var(--sky-bottom) 100%);
          z-index: 0;
        }

        /* ---------- sun ---------- */
        .sun {
          position: absolute;
          left: 50%; top: 88px;
          width: 152px; height: 152px;
          transform: translateX(-50%);
          border-radius: 50%;
          overflow: hidden;
          background: radial-gradient(circle at 50% 38%, var(--sun-core), var(--sun) 72%);
          box-shadow: 0 0 60px rgba(250, 158, 0, .55), 0 0 140px rgba(250, 158, 0, .25);
          z-index: 1;
        }
        .sun span {
          position: absolute;
          left: 0; width: 100%;
        }
        .sun .c1 { top: 56%; height: 3px; background: #7a1550; }
        .sun .c2 { top: 65%; height: 4px; background: #8f1a48; }
        .sun .c3 { top: 73%; height: 5px; background: #a52140; }
        .sun .c4 { top: 80%; height: 7px; background: #bb2f34; }
        .sun .c5 { top: 86%; height: 9px; background: #d14a1c; }
        .sun .c6 { top: 92%; height: 12px; background: #d16500; }

        /* ---------- mountains ---------- */
        .mountains {
          position: absolute;
          left: 0; top: 100px;
          width: 100%; height: 105px;
          z-index: 2;
        }
        .mtn { position: absolute; inset: 0; }
        .mtn.back {
          background: var(--mtn-shadow);
          clip-path: polygon(0% 100%, 0% 55%, 8% 30%, 16% 60%, 24% 15%, 33% 50%, 44% 10%, 55% 45%, 64% 20%, 74% 55%, 84% 25%, 92% 50%, 100% 20%, 100% 100%);
        }
        .mtn.mid {
          background: var(--mtn);
          clip-path: polygon(0% 100%, 0% 70%, 10% 40%, 20% 65%, 30% 25%, 40% 55%, 50% 15%, 60% 50%, 70% 30%, 80% 60%, 90% 35%, 100% 60%, 100% 100%);
        }
        .mtn.front {
          background: var(--mtn-dark);
          clip-path: polygon(0% 100%, 0% 85%, 15% 70%, 30% 88%, 45% 65%, 60% 90%, 75% 72%, 90% 92%, 100% 80%, 100% 100%);
        }

        /* ---------- cityscape ---------- */
        .city { position: absolute; bottom: 145px; z-index: 3; }
        .city.left { left: 0; }
        .city.right { right: 0; }
        .bldg {
          position: absolute;
          bottom: 0;
          background: var(--building);
        }
        .spire {
          position: absolute;
          bottom: 100%;
          left: 50%;
          width: 1px;
          background: var(--building);
          transform: translateX(-50%);
        }
        .win {
          position: absolute;
          width: 4px; height: 4px;
          background: var(--light);
        }
        .win.dim { background: var(--light-dim); }
        .win.blink { animation: blink 4.5s ease-in-out infinite; }
        .beacon {
          position: absolute;
          bottom: 100%;
          left: 50%;
          width: 4px; height: 4px;
          margin-left: -2px;
          border-radius: 50%;
          background: var(--beacon);
          box-shadow: 0 0 6px var(--beacon);
          animation: beacon 1.2s steps(1) infinite;
        }

        @keyframes blink {
          0%, 38% { opacity: 1; }
          50%, 88% { opacity: .15; }
          100% { opacity: 1; }
        }
        @keyframes beacon {
          0%, 49% { opacity: 1; }
          50%, 100% { opacity: .1; }
        }

        /* ---------- palm ---------- */
        .palm {
          position: absolute;
          left: 230px; bottom: 145px;
          width: 1px; height: 1px;
          z-index: 5;
        }
        .trunk {
          position: absolute;
          bottom: 0; left: 0;
          width: 5px;
          background: var(--mtn-shadow);
          transform-origin: bottom center;
        }
        .trunk.s1 { height: 26px; transform: rotate(1deg); }
        .trunk.s2 { height: 26px; bottom: 24px; transform: rotate(3deg); }
        .trunk.s3 { height: 24px; bottom: 46px; width: 4px; transform: rotate(6deg); }
        .trunk.s4 { height: 22px; bottom: 66px; width: 3px; transform: rotate(10deg); }

        .crown { position: absolute; left: 9px; bottom: 86px; width: 1px; height: 1px; }
        .frond {
          position: absolute;
          left: 0; bottom: 0;
          width: 46px; height: 8px;
          background: var(--mtn-shadow);
          transform-origin: 0% 50%;
          border-radius: 0 60% 60% 0;
          animation: sway ease-in-out infinite;
        }
        .frond.f1 { transform: rotate(-12deg); animation-duration: 4.2s; }
        .frond.f2 { transform: rotate(-50deg); animation-duration: 3.6s; animation-delay: -1s; }
        .frond.f3 { transform: rotate(-90deg); animation-duration: 5s; animation-delay: -2.4s; }
        .frond.f4 { transform: rotate(-130deg); animation-duration: 3.8s; animation-delay: -.6s; }
        .frond.f5 { transform: rotate(-168deg); animation-duration: 4.6s; animation-delay: -3s; }
        .hub {
          position: absolute; left: -4px; bottom: -4px;
          width: 8px; height: 8px; border-radius: 50%;
          background: var(--mtn-shadow);
        }

        @keyframes sway {
          0%, 100% { margin-top: 0deg; filter: none; }
          50% { filter: none; }
        }
        .frond.f1 { animation-name: sway1; }
        .frond.f2 { animation-name: sway2; }
        .frond.f3 { animation-name: sway3; }
        .frond.f4 { animation-name: sway4; }
        .frond.f5 { animation-name: sway5; }
        @keyframes sway1 { 0%, 100% { transform: rotate(-12deg); } 50% { transform: rotate(-19deg); } }
        @keyframes sway2 { 0%, 100% { transform: rotate(-50deg); } 50% { transform: rotate(-58deg); } }
        @keyframes sway3 { 0%, 100% { transform: rotate(-90deg); } 50% { transform: rotate(-93deg); } }
        @keyframes sway4 { 0%, 100% { transform: rotate(-130deg); } 50% { transform: rotate(-122deg); } }
        @keyframes sway5 { 0%, 100% { transform: rotate(-168deg); } 50% { transform: rotate(-161deg); } }

        /* ---------- ground / grid ---------- */
        .ground {
          position: absolute;
          left: 0; top: var(--horizon);
          width: 100%; height: calc(350px - var(--horizon));
          overflow: hidden;
          background: var(--ground);
          z-index: 4;
        }
        .haze {
          position: absolute;
          left: 50%; top: -40px;
          width: 640px; height: 160px;
          transform: translateX(-50%);
          background: radial-gradient(ellipse at center, var(--grid-haze) 0%, transparent 70%);
          opacity: .55;
          filter: blur(6px);
        }
        .grid-persp { position: absolute; inset: 0; perspective: 260px; overflow: hidden; }
        .grid-plane {
          position: absolute;
          left: -50%; top: 0;
          width: 200%; height: 260%;
          transform-origin: top center;
          transform: rotateX(58deg);
          background-image:
            linear-gradient(var(--grid) 1.5px, transparent 1.5px),
            linear-gradient(90deg, var(--grid) 1.5px, transparent 1.5px);
          background-size: 100% 32px, 32px 100%;
          animation: grid-scroll 1.1s linear infinite;
        }
        .grid-plane.glow {
          filter: blur(4px);
          opacity: .65;
          background-image:
            linear-gradient(var(--grid-glow) 2px, transparent 2px),
            linear-gradient(90deg, var(--grid-glow) 2px, transparent 2px);
        }
        @keyframes grid-scroll {
          from { background-position: 0 0, 0 0; }
          to   { background-position: 0 32px, 0 0; }
        }

        /* ---------- title ---------- */
        .title {
          position: absolute;
          left: 50%; bottom: 20px;
          transform: translateX(-50%);
          z-index: 6;
          font-size: 40px;
          font-weight: 900;
          letter-spacing: 8px;
          color: var(--grid);
          animation: glow-pulse 3s ease-in-out infinite;
        }
        @keyframes glow-pulse {
          0%, 100% {
            text-shadow: 0 0 10px var(--grid), 0 0 30px var(--grid), 0 0 60px rgba(217, 2, 128, 0.5);
          }
          50% {
            text-shadow: 0 0 6px var(--grid), 0 0 16px var(--grid), 0 0 36px rgba(217, 2, 128, 0.35);
          }
        }
      </style>

      <body>
        <div class="scene">
          <div class="sky"></div>

          <div class="sun">
            <span class="c1"></span>
            <span class="c2"></span>
            <span class="c3"></span>
            <span class="c4"></span>
            <span class="c5"></span>
            <span class="c6"></span>
          </div>

          <div class="mountains">
            <div class="mtn back"></div>
            <div class="mtn mid"></div>
            <div class="mtn front"></div>
          </div>

          <div class="city left">
            <div class="bldg" style="left:6px; width:44px; height:110px;">
              <span class="win" style="left:8px; top:20px;"></span>
              <span class="win dim blink" style="left:8px; top:34px;"></span>
              <span class="win blink" style="left:22px; top:26px;"></span>
              <span class="win" style="left:22px; top:48px;"></span>
            </div>
            <div class="bldg" style="left:56px; width:34px; height:78px;">
              <span class="win blink" style="left:8px; top:14px;"></span>
              <span class="win dim blink" style="left:8px; top:30px;"></span>
              <span class="win" style="left:18px; top:22px;"></span>
            </div>
            <div class="bldg" style="left:96px; width:26px; height:52px;">
              <span class="win dim blink" style="left:6px; top:10px;"></span>
              <span class="win blink" style="left:16px; top:20px;"></span>
            </div>
          </div>

          <div class="city right">
            <div class="bldg" style="right:10px; width:48px; height:128px;">
              <span class="spire" style="height:26px;"></span>
              <span class="beacon"></span>
              <span class="win blink" style="left:10px; top:18px;"></span>
              <span class="win" style="left:10px; top:34px;"></span>
              <span class="win dim blink" style="left:26px; top:26px;"></span>
              <span class="win blink" style="left:26px; top:50px;"></span>
            </div>
            <div class="bldg" style="right:64px; width:32px; height:84px;">
              <span class="win" style="left:8px; top:16px;"></span>
              <span class="win dim blink" style="left:18px; top:28px;"></span>
            </div>
            <div class="bldg" style="right:102px; width:24px; height:58px;">
              <span class="win blink" style="left:6px; top:12px;"></span>
            </div>
          </div>

          <div class="palm">
            <div class="trunk s1"></div>
            <div class="trunk s2"></div>
            <div class="trunk s3"></div>
            <div class="trunk s4"></div>
            <div class="crown">
              <div class="frond f1"></div>
              <div class="frond f2"></div>
              <div class="frond f3"></div>
              <div class="frond f4"></div>
              <div class="frond f5"></div>
              <div class="hub"></div>
            </div>
          </div>

          <div class="ground">
            <div class="haze"></div>
            <div class="grid-persp">
              <div class="grid-plane glow"></div>
              <div class="grid-plane"></div>
            </div>
          </div>

          <div class="title">HOXZ</div>
        </div>
      </body>
    </div>
  </foreignObject>
</svg>
