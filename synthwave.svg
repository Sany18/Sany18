            <div class="dline glow" style="left:-70px; top:125.5px; width:110.92px; transform:rotate(-25.64deg);"></div>
            <div class="dline" style="left:-70px; top:126.5px; width:110.92px; transform:rotate(-25.64deg);"></div>
            <div class="dline glow" style="left:-40px; top:125.5px; width:93.30px; transform:rotate(-30.96deg);"></div>
            <div class="dline" style="left:-40px; top:126.5px; width:93.30px; transform:rotate(-30.96deg);"></div>
            <div class="dline glow" style="left:-10px; top:125.5px; width:76.84px; transform:rotate(-38.66deg);"></div>
            <div class="dline" style="left:-10px; top:126.5px; width:76.84px; transform:rotate(-38.66deg);"></div>
            <div class="dline glow" style="left:20px; top:125.5px; width:62.48px; transform:rotate(-50.19deg);"></div>
            <div class="dline" style="left:20px; top:126.5px; width:62.48px; transform:rotate(-50.19deg);"></div>
            <div class="dline glow" style="left:50px; top:125.5px; width:52.00px; transform:rotate(-67.38deg);"></div>
            <div class="dline" style="left:50px; top:126.5px; width:52.00px; transform:rotate(-67.38deg);"></div>
            <div class="dline glow" style="left:80px; top:125.5px; width:48.00px; transform:rotate(-90.00deg);"></div>
